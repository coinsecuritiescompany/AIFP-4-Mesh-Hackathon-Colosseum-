name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run ci
      - run: npm run demo:smoke
      - run: npm run demo:configure
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Smoke test one-command stack
        run: |
          docker compose up -d --wait
          curl --fail --silent http://127.0.0.1:4044/health
          curl --fail --silent http://127.0.0.1:4044/ | grep -q 'AIFP-4 Mesh'
          curl --fail --silent http://127.0.0.1:4044/styles.css | grep -q 'color-scheme'
          node scripts/compose-smoke.mjs
      - if: always()
        run: docker compose down
