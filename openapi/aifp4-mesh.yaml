openapi: 3.1.0
info:
  title: AIFP-4 Mesh Sandbox API
  version: 0.2.0
  description: Local sandbox agent payments. Solana Devnet proof is a separate CLI flow.
servers:
  - url: http://localhost:4044
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': {description: Healthy}
  /v1/stats:
    get:
      responses:
        '200': {description: Dashboard counts and mock USDC volume}
  /v1/routes:
    get:
      parameters:
        - {in: query, name: asset, schema: {type: string}}
      responses:
        '200': {description: Routes and online state}
  /v1/mesh/network:
    post:
      summary: Toggle mock rail connectivity for a local demo
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [online], properties: {online: {type: boolean}}}
      responses:
        '200': {description: Updated routes}
  /v1/mesh/reconcile:
    post:
      responses:
        '200': {description: Reconciled queued intents}
  /v1/agents:
    get:
      responses:
        '200': {description: Agents}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string}, policy: {$ref: '#/components/schemas/PolicyInput'}}}
      responses:
        '201': {description: Agent created}
  /v1/agents/{id}:
    get:
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {description: Agent}
        '404': {description: Not found}
  /v1/agents/{id}/policy:
    put:
      parameters:
        - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [policyId], properties: {policyId: {type: string}}}
      responses:
        '200': {description: Agent with assigned policy}
  /v1/policies:
    get:
      responses:
        '200': {description: Policies}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyInput'}
      responses:
        '201': {description: Policy created}
  /v1/intents:
    get:
      responses:
        '200': {description: Latest 100 intents}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateIntent'}
      responses:
        '201': {description: Authorized or queued intent}
        '422': {description: Policy or validation error}
  /v1/intents/{id}:
    get:
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {description: Intent detail}
        '404': {description: Not found}
  /v1/intents/{id}/execute:
    post:
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {description: Settled or queued intent}
  /v1/transactions:
    get:
      responses:
        '200': {description: Latest 100 transactions}
  /v1/receipts:
    get:
      responses:
        '200': {description: Latest 100 receipts}
  /v1/receipts/{id}:
    get:
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200': {description: Receipt detail}
        '404': {description: Not found}
components:
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: string}}
  securitySchemes:
    ApiKeyAuth: {type: apiKey, in: header, name: x-aifp4-api-key}
  schemas:
    CreateIntent:
      type: object
      required: [idempotencyKey, agentId, beneficiary, amountMinor, asset, purpose]
      properties:
        idempotencyKey: {type: string, minLength: 3, maxLength: 128}
        agentId: {type: string}
        beneficiary: {type: string}
        amountMinor: {type: integer, minimum: 1}
        asset: {type: string, enum: [USDC, SOL]}
        purpose: {type: string}
        expiresAt: {type: string, format: date-time}
    PolicyInput:
      type: object
      properties:
        maxAmountMinor: {type: integer, minimum: 1}
        dailyLimitMinor: {type: integer, minimum: 1}
        maxTransactions: {type: integer, minimum: 1}
        allowedAssets: {type: array, items: {type: string}}
        allowedRails: {type: array, items: {type: string}}
        beneficiaryAllowlist: {type: array, items: {type: string}}
        beneficiaryDenylist: {type: array, items: {type: string}}
        offlineAllowed: {type: boolean}
