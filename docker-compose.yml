services:
  aifp4-mesh:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${AIFP4_BIND_HOST:-127.0.0.1}:${AIFP4_PORT:-4044}:4044"
    environment:
      PORT: "4044"
      NODE_ENV: production
      AIFP4_API_KEY: ${AIFP4_API_KEY:-sandbox-demo-key}
      MESH_HMAC_SECRET: ${MESH_HMAC_SECRET:-sandbox-only-change-me}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4044/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
